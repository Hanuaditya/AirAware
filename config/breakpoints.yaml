# CPCB National Air Quality Index (AQI) Breakpoints
# Verified against CPCB "National Air Quality Index" / "About National AQI" documentation (October 2014)
# Concentration units: µg/m³ (24-hour average)
# Sub-index formula: I_p = ((I_hi - I_lo) / (BP_hi - BP_lo)) * (C_p - BP_lo) + I_lo

pm25:
